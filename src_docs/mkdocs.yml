# this_file: src_docs/mkdocs.yml
site_name: Fly for FontLab
site_description: Nine short imports for the canonical FontLab scripting packages.
site_url: https://fontlabcom.github.io/fontlab-fly/
repo_url: https://github.com/fontlabcom/fontlab-fly
repo_name: fontlabcom/fontlab-fly
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  language: en
  custom_dir: overrides
  palette:
    scheme: default
  features:
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Installation: installation.md
  - Imports and providers: imports.md
  - Development: development.md
  - Licence: licence.md
extra_css:
  - https://i.fontlab.com/fltheme26/1.0.0/components.css
  - https://i.fontlab.com/fltheme26/1.0.0/theme.css
extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js
hooks:
  - english_search.py
