# this_file: pyproject.toml
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"
[project]
name = "fontlab-fly"
dynamic = ["version"]
description = "Short exact aliases for FontLab scripting packages"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["fontlab-echopy>=0.1.0", "typerig>=0.1.0", "fontlab-fontlabapp>=1.2.0", "pythonqtside>=0.1.0", "fontlab-glyport>=1.2.0", "fontlab-fontport>=1.2.0", "fontlab-python-pens>=1.0.0"]
[project.urls]
Repository = "https://github.com/fontlabcom/fontlab-fly"
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
fallback_version = "0.1.0"
[tool.hatch.build.targets.wheel]
packages = ["src/fly"]
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "skills", "pyproject.toml", "README.md", "PLAN.md", "TODO.md", "LICENSE", "NOTICE", "CHANGELOG.md", "DEPENDENCIES.md", "test.sh"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.fontlab-install]
# install.vfpy: reverse-domain id; FontLab keeps Extensions/<id>/install.log.
id = "com.fontlab.fly"
